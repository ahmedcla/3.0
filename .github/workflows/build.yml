name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip the project
        run: |
          set -e
          PROJECT="$GITHUB_WORKSPACE"
          if [ ! -f "$PROJECT/gradlew" ]; then
            newest=""; newest_time=0
            for z in *.zip; do
              [ -f "$z" ] || continue
              t=$(git log -1 --format=%ct -- "$z")
              if [ "$t" -ge "$newest_time" ]; then newest="$z"; newest_time="$t"; fi
            done
            if [ -z "$newest" ]; then echo "No zip file or gradlew found in the repo"; exit 1; fi
            echo "Using zip: $newest"
            mkdir -p "$RUNNER_TEMP/project"
            unzip -q -o "$newest" -d "$RUNNER_TEMP/project"
            gradlew_path=$(find "$RUNNER_TEMP/project" -name gradlew -type f | head -n 1)
            if [ -z "$gradlew_path" ]; then echo "gradlew not found inside the zip"; exit 1; fi
            PROJECT=$(dirname "$gradlew_path")
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: elementalarsenal-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
